# muse2api —— Docker Compose 部署（官方镜像，单个服务）
#
#   cp .env.example .env     # 至少填 MUSE2API_KEY
#   docker compose pull && docker compose up -d
#
# 镜像：ghcr.io/nowaytower/muse2api（linux/amd64 / linux/arm64 同一 tag，按机器自动选）
# 所有配置都在 .env 里，整份注入容器（env_file），不需要在下面逐项映射。
# 想从源码构建：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  muse2api:
    image: ghcr.io/nowaytower/muse2api:${MUSE2API_TAG:-latest}
    container_name: muse2api
    restart: unless-stopped
    ports:
      # 默认只绑宿主机回环：公网用 服务器IP:端口 打不开，只能本机反代/SSH 隧道访问。
      # 要允许局域网直连就把 .env 里的 MUSE2API_BIND_ADDR 改成 0.0.0.0
      - "${MUSE2API_BIND_ADDR:-127.0.0.1}:${MUSE2API_HOST_PORT:-18610}:18610"
    env_file:
      - .env
    environment:
      # 容器内必须监听全部网卡 + 固定 18610，否则端口映射进不来（覆盖 .env 同名值）
      MUSE2API_HOST: 0.0.0.0
      MUSE2API_PORT: "18610"
    volumes:
      # 账号、任务、媒体、缩略图都在这里，删容器不丢数据
      - ./data:/app/data
    # Chromium 多标签页渲染吃 /dev/shm，2g 可显著减少崩溃
    shm_size: "2gb"
    # 浏览器日志量大，限制单文件 20m × 3 份，避免写满磁盘
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
